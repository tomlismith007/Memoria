name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      # Tests import the real stack (langgraph/chromadb/fastapi/...), so CI must
      # install the project — a bare `pip install pytest` has failed collection
      # since feat-002 ever landed on CI.
      - run: pip install -e .[dev]
      - run: python -m pytest -q

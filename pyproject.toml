[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
version = "0.1.0"
description = "Personal knowledge system: RAG + LLM Wiki + email triage, orchestrated with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph",   # orchestration (feat-007); retrieval core stays hand-written
  "langgraph-checkpoint-sqlite",  # durable graph state on disk (feat-033)
  "chromadb",    # local vector store (feat-002)
  "pypdf",       # PDF parsing (feat-002)
  "requests",    # Google OAuth transport
  "google-api-python-client",  # Gmail API (feat-006)
  "google-auth-oauthlib",      # Gmail OAuth helper (feat-016)
  "fastapi",     # web API (feat-010)
  "uvicorn",     # ASGI server (feat-010)
  "python-multipart", # form/upload support (feat-010)
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["."]
